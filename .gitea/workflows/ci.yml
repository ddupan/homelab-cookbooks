name: ci

# PR 是唯一的门：合并到 main 与打 tag 不再重跑同一份代码（之前每个变更 PR、main、tag 各跑一遍，
# 每遍三个 cookbook）。PR 只测改动到的 cookbook 及依赖它的 cookbook；手动触发时全部测。
on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: [self-hosted, pod]
    outputs:
      cookbooks: ${{ steps.pick.outputs.cookbooks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 依赖关系取自各 metadata.rb 的 depends：改 homelab_base 时，依赖它的 cookbook 一并测。
      # CI 配置本身改动时全部测。
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          all=$(ls cookbooks)
          if [ -z "${BASE:-}" ]; then
            changed=$all
          else
            files=$(git diff --name-only "$BASE"...HEAD)
            if printf '%s\n' "$files" | grep -q '^\.gitea/'; then
              changed=$all
            else
              changed=$(printf '%s\n' "$files" | sed -n 's|^cookbooks/\([^/]*\)/.*|\1|p' | sort -u)
            fi
          fi
          picked=""
          for cb in $all; do
            for c in $changed; do
              if [ "$cb" = "$c" ] || grep -q "^depends '$c'" "cookbooks/$cb/metadata.rb"; then
                picked="$picked $cb"
                break
              fi
            done
          done
          json="[]"
          if [ -n "$picked" ]; then
            json=$(printf '"%s",' $picked)
            json="[${json%,}]"
          fi
          echo "cookbooks=$json" >> "$GITHUB_OUTPUT"
          echo "testing: $json"

      # Registry versions are immutable and publish.yml skips versions already there, so a
      # changed cookbook without a version bump would merge but never reach any node.
      - name: Changed cookbooks bump their version
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SITE: https://git.ddupan.top/api/packages/panxiao81/chef
        run: |
          set -euo pipefail
          [ -n "${BASE:-}" ] || exit 0
          fail=0
          for cb in $(git diff --name-only "$BASE"...HEAD | sed -n 's|^cookbooks/\([^/]*\)/.*|\1|p' | sort -u); do
            [ -f "cookbooks/$cb/metadata.rb" ] || continue
            version=$(sed -n "s/^version *['\"]\([^'\"]*\).*/\1/p" "cookbooks/$cb/metadata.rb")
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors \
              "$SITE/api/v1/cookbooks/$cb/versions/$version")
            case "$code" in
              200) echo "::error::$cb $version is already published; bump its version"; fail=1 ;;
              404) echo "$cb $version is new" ;;
              *) echo "::error::registry answered $code for $cb $version"; fail=1 ;;
            esac
          done
          exit $fail

  test:
    needs: changes
    if: needs.changes.outputs.cookbooks != '[]'
    runs-on: [self-hosted, pod]
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJSON(needs.changes.outputs.cookbooks) }}
    env:
      # Pinned to a release tag; bump deliberately (it carries Cinc Client and Kitchen).
      WORKSTATION: cincproject/workstation:26.3.0
    steps:
      - uses: actions/checkout@v7

      # Docker Hub rate-limits anonymous pulls per egress IP, and every Pod runner
      # starts with an empty image store; all images come through Nexus instead.
      - id: nexus
        uses: https://git.ddupan.top/panxiao81/ci-actions/setup-nexus@v1
        with:
          nexus-url: https://nexus.lab.ddupan.top
          oci: 'true'

      # The WAN drops at random; every pull retries.
      - name: Pull images
        env:
          REGISTRY: ${{ steps.nexus.outputs.oci-public }}
        run: |
          registry="${REGISTRY#https://}"
          echo "DOKKEN_REGISTRY=$registry" >> "$GITHUB_ENV"
          echo "WORKSTATION=$registry/$WORKSTATION" >> "$GITHUB_ENV"
          for image in "$WORKSTATION" cincproject/cinc:19 \
                       dokken/ubuntu-24.04 dokken/debian-12 dokken/debian-13; do
            for i in 1 2 3 4 5; do docker pull -q "$registry/$image" && break; sleep 15; done
          done
          # kitchen-dokken builds its data image FROM <registry>/almalinux:9 without
          # pulling; an official image is library/<name> behind the proxy.
          for i in 1 2 3 4 5; do docker pull -q "$registry/library/almalinux:9" && break; sleep 15; done
          docker tag "$registry/library/almalinux:9" "$registry/almalinux:9"

      # Cookstyle + ChefSpec first: seconds, and a failure here skips Kitchen.
      # Kitchen then converges twice per platform (second run must update nothing)
      # and runs the InSpec suite. --network host: the workstation container must
      # reach the dokken bridge, which a default-bridge container cannot.
      # All of cookbooks/ is mounted: a Policyfile may take a sibling by path.
      # test/unit holds Python tests for scripts a cookbook ships (homelab_data's collector).
      - name: Lint, unit, integration
        run: |
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOKKEN_REGISTRY \
            -v "$PWD/cookbooks:/cookbooks" -w "/cookbooks/${{ matrix.cookbook }}" "$WORKSTATION" \
            bash -lc 'cookstyle . && { [ ! -d test/unit ] || python3 -m unittest discover -s test/unit; } &&
                      cinc install && cinc exec rspec && kitchen test --destroy=always'
