name: release

# Keeps one release PR (branch release/cookbooks) up to date with every cookbook that has
# releasable commits since its last version change (.gitea/scripts/release.py): it bumps
# metadata.rb and prepends that cookbook's CHANGELOG.md. Merging it is the release:
# publish.yml then pushes the new versions to the registry. Feature PRs no longer bump
# versions, so a week of merges becomes one release per cookbook instead of one per PR.
#
# The job token pushes the branch and opens the PR. Gitea does not start workflows for
# events made with that token, so the release PR gets no CI; it only changes version lines
# and changelogs, and every commit in it already passed CI on its own PR.
on:
  push:
    branches: [main]
    paths: ['cookbooks/**']
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: [self-hosted, pod]
    env:
      BRANCH: release/cookbooks
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
      GITEA_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # release.py walks history back to each version change

      - name: Compute releases
        run: python3 .gitea/scripts/release.py --write --summary "$RUNNER_TEMP/summary.md"

      - name: Open or update the release PR
        run: |
          set -euo pipefail
          auth=(-H "Authorization: token $GITEA_TOKEN" -H 'Content-Type: application/json')
          existing=$(curl -fsS --retry 5 --retry-all-errors "${auth[@]}" "$API/pulls?state=open&limit=50" |
            python3 -c "import json,sys; print(next((str(p['number']) for p in json.load(sys.stdin) if p['head']['ref']=='$BRANCH'), ''))")

          if [ ! -s "$RUNNER_TEMP/summary.md" ]; then
            # Nothing pending (e.g. the release PR was just merged); drop a stale one.
            if [ -n "$existing" ]; then
              curl -fsS --retry 5 --retry-all-errors "${auth[@]}" -X PATCH -d '{"state":"closed"}' "$API/pulls/$existing" >/dev/null
              echo "closed stale release PR #$existing"
            fi
            exit 0
          fi

          git config user.name 'gitea-actions'
          git config user.email 'actions@noreply.ddupan.top'
          git checkout -B "$BRANCH"
          # add -A: a cookbook's first CHANGELOG.md is a new file, which commit -a would skip.
          git add -A cookbooks
          git commit -qm 'chore(release): 发布 cookbook'
          # Rebuilt from main on every run, so force is expected. The header keeps the token out
          # of the remote URL and .git/config; nothing here runs under set -x.
          git -c "http.extraHeader=Authorization: token $GITEA_TOKEN" push -qf origin "HEAD:refs/heads/$BRANCH"

          body=$(python3 -c "import json,sys; print(json.dumps({
            'title': 'chore(release): 发布 cookbook',
            'body': '合并即发布：publish.yml 把下列版本推到 registry。节点仍按 homelab-infra 的 policy 固定版本运行，'
                    '要用新版本需在那边改 \`= 版本\` 并 \`cinc update\`。\n\n' + open(sys.argv[1]).read(),
            'head': '$BRANCH', 'base': 'main'}))" "$RUNNER_TEMP/summary.md")
          if [ -n "$existing" ]; then
            curl -fsS --retry 5 --retry-all-errors "${auth[@]}" -X PATCH -d "$body" "$API/pulls/$existing" >/dev/null
            echo "updated release PR #$existing"
          else
            curl -fsS --retry 5 --retry-all-errors "${auth[@]}" -X POST -d "$body" "$API/pulls" >/dev/null
            echo "opened release PR"
          fi
