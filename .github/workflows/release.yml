name: release

# release-please keeps one release PR up to date with every cookbook that has releasable commits
# (release-please-config.json: feat → minor, fix/perf/revert → patch, `!` → minor before 1.0). It
# bumps metadata.rb (the `x-release-please-version` line) and that cookbook's CHANGELOG.md.
# Merging it is the release: release-please tags `<cookbook>-v<version>` and creates the GitHub
# Release, and publish.yml pushes the new versions to the registry.
#
# The token is ddupan-bot's (GitHub App): events made with the job token start no workflows, so
# a release PR opened with it would get no CI.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
