name: ci

# PR 是唯一的门：合并到 main 与打 tag 不再重跑同一份代码（之前每个变更 PR、main、tag 各跑一遍，
# 每遍三个 cookbook）。PR 只测改动到的 cookbook 及依赖它的 cookbook；手动触发时全部测。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      cookbooks: ${{ steps.pick.outputs.cookbooks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 依赖关系取自各 metadata.rb 的 depends：改 homelab_base 时，依赖它的 cookbook 一并测。
      # CI 配置本身改动时全部测。
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          all=$(ls cookbooks)
          if [ -z "${BASE:-}" ]; then
            changed=$all
          else
            files=$(git diff --name-only "$BASE"...HEAD)
            if printf '%s\n' "$files" | grep -q '^\.github/'; then
              changed=$all
            else
              changed=$(printf '%s\n' "$files" | sed -n 's|^cookbooks/\([^/]*\)/.*|\1|p' | sort -u)
            fi
          fi
          picked=""
          for cb in $all; do
            for c in $changed; do
              if [ "$cb" = "$c" ] || grep -q "^depends '$c'" "cookbooks/$cb/metadata.rb"; then
                picked="$picked $cb"
                break
              fi
            done
          done
          json="[]"
          if [ -n "$picked" ]; then
            json=$(printf '"%s",' $picked)
            json="[${json%,}]"
          fi
          echo "cookbooks=$json" >> "$GITHUB_OUTPUT"
          echo "testing: $json"

      # PR 不再升 metadata.rb 的 version：release.yml 按 Conventional Commits 汇总成发布 PR。
      # 这里测分类规则，并预览合并后这些提交会让哪些 cookbook 发什么版本。
      - name: Release plan
        run: |
          python3 .github/scripts/test_release.py
          python3 .github/scripts/release.py

  test:
    needs: changes
    if: needs.changes.outputs.cookbooks != '[]'
    # GitHub-hosted, except homelab_ayatori: its Kitchen suite runs the ayatori-manager release image,
    # which is published only to the LAN zot for now. When ayatori publishes to ghcr, point the suite
    # there and drop this condition and the Nexus step.
    runs-on: ${{ matrix.cookbook == 'homelab_ayatori' && 'homelab' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJSON(needs.changes.outputs.cookbooks) }}
    env:
      # Pinned to a release tag; bump deliberately (it carries Cinc Client and Kitchen).
      WORKSTATION: cincproject/workstation:26.3.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # On the homelab runner images come through the LAN Nexus (Docker Hub proxy and the group the
      # ayatori suite needs for ghcr.io/registry.k8s.io). GitHub-hosted runners pull directly.
      - id: nexus
        if: matrix.cookbook == 'homelab_ayatori'
        uses: ddupan/ci-actions/setup-nexus@v1
        with:
          nexus-url: https://nexus.lab.ddupan.top
          oci: 'true'

      # The WAN drops at random; every pull retries.
      - name: Pull images
        env:
          REGISTRY: ${{ steps.nexus.outputs.oci-public }}
        run: |
          registry="${REGISTRY#https://}"
          prefix=${registry:+$registry/}
          if [ -n "$registry" ]; then
            echo "DOKKEN_REGISTRY=$registry" >> "$GITHUB_ENV"
            echo "WORKSTATION=$prefix$WORKSTATION" >> "$GITHUB_ENV"
          fi
          for image in "$WORKSTATION" cincproject/cinc:19 \
                       dokken/ubuntu-24.04 dokken/debian-12 dokken/debian-13; do
            for i in 1 2 3 4 5; do docker pull -q "$prefix$image" && break; sleep 15; done
          done
          # kitchen-dokken builds its data image FROM <registry>/almalinux:9 without pulling; behind
          # the proxy an official image is library/<name>.
          if [ -n "$registry" ]; then
            for i in 1 2 3 4 5; do docker pull -q "$registry/library/almalinux:9" && break; sleep 15; done
            docker tag "$registry/library/almalinux:9" "$registry/almalinux:9"
          fi

      # Cookstyle + ChefSpec first: seconds, and a failure here skips Kitchen.
      # Kitchen then converges twice per platform (second run must update nothing)
      # and runs the InSpec suite. --network host: the workstation container must
      # reach the dokken bridge, which a default-bridge container cannot.
      # All of cookbooks/ is mounted: a Policyfile may take a sibling by path.
      # test/unit holds Python tests for scripts a cookbook ships (homelab_data's collector).
      # `-e DOKKEN_REGISTRY` passes it only when set (homelab runner).
      - name: Lint, unit, integration
        run: |
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOKKEN_REGISTRY \
            -v "$PWD/cookbooks:/cookbooks" -w "/cookbooks/${{ matrix.cookbook }}" "$WORKSTATION" \
            bash -lc 'cookstyle . && { [ ! -d test/unit ] || python3 -m unittest discover -s test/unit; } &&
                      cinc install && cinc exec rspec && kitchen test --destroy=always'
