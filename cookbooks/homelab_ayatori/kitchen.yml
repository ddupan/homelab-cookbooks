---
driver:
  name: dokken
  privileged: true
  chef_version: '19'
  # See homelab_loadbalancer: CI pulls through the Nexus Docker Hub proxy.
  docker_registry: <%= ENV['DOKKEN_REGISTRY'] || '~' %>

provisioner:
  name: dokken
  product_name: cinc
  # The acceptance test: a second converge must update nothing.
  enforce_idempotency: true
  multiple_converge: 2

transport:
  name: dokken

verifier:
  name: inspec

platforms:
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /bin/systemd

suites:
  - name: default
    attributes:
      # Optional pull-through mirror for every registry (e.g. a LAN Nexus group); unset in CI.
      ayatori_test:
        registry_mirror: <%= ENV['DOKKEN_REGISTRY'] %>
      homelab_ayatori:
        environment: dev
        release: v0.5.0
        # The release image from ghcr (public), so the suite runs on GitHub-hosted runners; Dev/Prod
        # pull the same digest from the LAN zot. The manager itself cannot reach Bao or PostgreSQL
        # from Kitchen and keeps restarting, which the suite does not check.
        image: ghcr.io/ddupan/ayatori-manager@sha256:57f8ca27614259921749cde82c8a1e36ae089ca6f1b856fa914e8893d5946fa4
        postgresql_instance:
          name: kitchen
          host: pg.invalid
          hostaddr: 127.0.0.1
          port: 5432
        postgresql_ca_source: file:///etc/ayatori-test/ca.pem
        # The apiserver need not reach the issuer: the suite checks the anonymous discovery path.
        oidc:
          issuer: https://sso.ddupan.top
          audiences: [ayatori-kitchen]
          admin_groups: [platform-admins]
