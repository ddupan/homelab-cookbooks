---
driver:
  name: dokken
  privileged: true
  chef_version: '19'
  # CI pulls every image (platform, Cinc, data) through the Nexus Docker Hub proxy:
  # anonymous Docker Hub pulls are rate-limited per egress IP and the lab shares one.
  # Unset locally, so a workstation pulls from Docker Hub directly.
  docker_registry: <%= ENV['DOKKEN_REGISTRY'] || '~' %>

provisioner:
  name: dokken
  product_name: cinc
  # The acceptance test: a second converge must update nothing.
  enforce_idempotency: true
  multiple_converge: 2

transport:
  name: dokken

verifier:
  name: inspec

platforms:
  - name: debian-13
    driver:
      image: dokken/debian-13
      pid_one_command: /lib/systemd/systemd

suites:
  - name: default
    attributes:
      homelab_loadbalancer:
        environment: dev
        # Never the real Bao: the renewal timer would register an ACME account and
        # open an order if it ever fired inside a test container.
        bao: https://bao.invalid:8200
        client_ca_source: file:///etc/lb-test/client-ca.pem
        dataplaneapi:
          # openssl passwd -6 of the test-only password "test-only".
          password_hash: '$6$OwCXPAJAHLh1AF7B$mwRxAs9Adub3bP22hUC8M/1smiqyjK5zWRUnI5bQFtYmF0mcxKD3TdGU1fB7v/9LftuCdsCe3w6wnoRCJjEHb1'
        bgp:
          local_as: 65101
          # No router in Kitchen: the session stays Active, which is all the suite checks.
          neighbors:
            127.0.0.2: 65000
          vip_pool: 10.62.0.0/24
