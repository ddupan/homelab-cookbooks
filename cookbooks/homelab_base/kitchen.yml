---
driver:
  name: dokken
  privileged: true
  chef_version: '19'
  # CI pulls every image (platform, Cinc, data) through the Nexus Docker Hub proxy:
  # anonymous Docker Hub pulls are rate-limited per egress IP and the lab shares one.
  # Unset locally, so a workstation pulls from Docker Hub directly.
  docker_registry: <%= ENV['DOKKEN_REGISTRY'] || '~' %>

provisioner:
  name: dokken
  product_name: cinc
  # The acceptance test: a second converge must update nothing.
  enforce_idempotency: true
  multiple_converge: 2

transport:
  name: dokken

verifier:
  name: inspec

platforms:
  - name: ubuntu-24.04
    driver:
      image: dokken/ubuntu-24.04
      pid_one_command: /bin/systemd
  - name: debian-12
    driver:
      image: dokken/debian-12
      pid_one_command: /bin/systemd

suites:
  - name: default
    attributes:
      homelab_base:
        # The fixture cookbook (base_test) serves Bao's two public documents from files: Kitchen
        # must not depend on the live Bao (and GitHub-hosted runners cannot reach it).
        bao: file:///var/tmp/fake-bao
